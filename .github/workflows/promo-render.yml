# Promo video rendering.
#
# Rendering happens here and only here: the authoring machine keeps no
# node_modules and no Chromium download. Stills run first so a storyboard can
# be reviewed before anyone spends a render on the MP4.
#
# Manual only — this workflow never runs on push.

name: Promo videos

on:
  workflow_dispatch:
    inputs:
      project:
        description: Project slug from data/projects.json
        type: string
        default: we-writes
      variant:
        description: Storyboard variant, or "all"
        type: choice
        options: [all, a, b, c, d, e]
        default: all
      stage:
        description: What to render
        type: choice
        options: [stills, video, both]
        default: both

permissions:
  contents: read

concurrency:
  group: promo-${{ github.ref }}-${{ inputs.project }}
  cancel-in-progress: true

env:
  REMOTION_VERSION: 4.0.429

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: pick
        run: |
          node -e '
            const fs = require("node:fs");
            const project = process.env.PROJECT;
            const wanted = process.env.VARIANT;
            const manifest = JSON.parse(
              fs.readFileSync("video/storyboards/manifest.json", "utf8"),
            );
            const entry = manifest[project];
            if (!entry) {
              console.error("No storyboard manifest for " + project);
              process.exit(1);
            }
            const derived = project
              .split("-")
              .map((w) => w[0].toUpperCase() + w.slice(1))
              .join("");
            const all = Object.keys(entry.variants);
            const variants = wanted === "all" ? all : all.filter((v) => v === wanted);
            if (!variants.length) {
              console.error("No such variant: " + wanted);
              process.exit(1);
            }
            // we-writes has one composition per variant (WeWritesA..E); the
            // batch promos have a single composition each, named in the manifest.
            const matrix = variants.map((v) => ({
              variant: v,
              composition: entry.composition ?? derived + v.toUpperCase(),
              poster: entry.variants[v].posterFrame ?? 30,
            }));
            console.log("matrix=" + JSON.stringify(matrix));
          ' >> "$GITHUB_OUTPUT"
        env:
          PROJECT: ${{ inputs.project }}
          VARIANT: ${{ inputs.variant }}

  stills:
    needs: plan
    if: inputs.stage != 'video'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: video/package-lock.json

      # node_modules is rebuilt per run and never committed.
      - name: Install
        working-directory: video
        run: npm ci

      - name: Report disk before rendering
        run: df -h /

      - name: Render one still per scene
        working-directory: video
        env:
          COMPOSITION: ${{ matrix.composition }}
          VARIANT: ${{ matrix.variant }}
          PROJECT: ${{ inputs.project }}
        run: |
          mkdir -p "storyboards/$PROJECT/$VARIANT"
          node -e '
            const fs = require("node:fs");
            const m = JSON.parse(fs.readFileSync("storyboards/manifest.json", "utf8"));
            const v = m[process.env.PROJECT].variants[process.env.VARIANT];
            for (const s of v.scenes) console.log(s.id + "\t" + s.frame);
          ' > /tmp/scenes.tsv

          while IFS=$'\t' read -r id frame; do
            echo "· $VARIANT/$id @ frame $frame"
            npx remotion still src/index.ts "$COMPOSITION" \
              "storyboards/$PROJECT/$VARIANT/$id.png" \
              --frame="$frame" --log=error
          done < /tmp/scenes.tsv

      - uses: actions/upload-artifact@v4
        with:
          name: storyboard-${{ inputs.project }}-${{ matrix.variant }}
          path: video/storyboards/${{ inputs.project }}/${{ matrix.variant }}/*.png
          retention-days: 14

  video:
    needs: [plan, stills]
    # Stills are the review gate: if they failed, or were all that was asked
    # for, no MP4 is rendered.
    if: |
      always() &&
      inputs.stage != 'stills' &&
      (needs.stills.result == 'success' || needs.stills.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: video/package-lock.json

      - name: Install
        working-directory: video
        run: npm ci

      - name: Render MP4
        working-directory: video
        env:
          COMPOSITION: ${{ matrix.composition }}
          VARIANT: ${{ matrix.variant }}
        run: |
          mkdir -p out
          # crf 20 measured 2.6 MB for the 16 s cut; 24 lands at ~1.0 MB
          # with no visible loss on flat UI, which leaves headroom under 2 MB.
          npx remotion render src/index.ts "$COMPOSITION" "out/$VARIANT.mp4" \
            --codec h264 --crf 24 --pixel-format yuv420p --log=error

      - name: Render WebM
        working-directory: video
        env:
          COMPOSITION: ${{ matrix.composition }}
          VARIANT: ${{ matrix.variant }}
        run: |
          # vp9 rather than vp8: vp8 crf 28 ran 20+ minutes on a bright
          # screen and landed over the 2 MB budget; vp9 at crf 32 encoded the
          # same cut in seconds at well under half the size.
          npx remotion render src/index.ts "$COMPOSITION" "out/$VARIANT.webm" \
            --codec vp9 --crf 32 --pixel-format yuv420p --log=error

      - name: Poster frame
        working-directory: video
        env:
          COMPOSITION: ${{ matrix.composition }}
          VARIANT: ${{ matrix.variant }}
        run: |
          npx remotion still src/index.ts "$COMPOSITION" "out/$VARIANT.jpg" \
            --frame="${{ matrix.poster }}" --image-format=jpeg --log=error

      # The site budget is 2 MB per clip. Fail here rather than at review.
      - name: Check size budget
        working-directory: video
        run: |
          for f in out/"${{ matrix.variant }}".mp4 out/"${{ matrix.variant }}".webm; do
            size=$(stat -c%s "$f")
            echo "$f $size bytes"
            if [ "$size" -gt 2097152 ]; then
              echo "::error::$f exceeds 2 MB"
              exit 1
            fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: promo-${{ inputs.project }}-${{ matrix.variant }}
          path: |
            video/out/${{ matrix.variant }}.mp4
            video/out/${{ matrix.variant }}.webm
            video/out/${{ matrix.variant }}.jpg
          retention-days: 14
